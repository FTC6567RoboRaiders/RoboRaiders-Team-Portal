<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Vibrant Red to Dark Charcoal/Black) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff331f" />
      <stop offset="26%" stop-color="#eb1e12" />
      <stop offset="52%" stop-color="#b8150d" />
      <stop offset="74%" stop-color="#541716" />
      <stop offset="88%" stop-color="#242327" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- Top Ambient Flare -->
    <radialGradient id="topFlare" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#ff7b66" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff2e1b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff2e1b" stop-opacity="0"/>
    </radialGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="70%" stop-color="rgba(0, 0, 0, 0.3)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.7)"/>
    </linearGradient>

    <!-- Badge Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Metallic Ring Gradients -->
    <linearGradient id="metalOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80808a"/>
      <stop offset="25%" stop-color="#5a5a63"/>
      <stop offset="50%" stop-color="#3c3c42"/>
      <stop offset="75%" stop-color="#55555e"/>
      <stop offset="100%" stop-color="#2c2c31"/>
    </linearGradient>

    <linearGradient id="metalInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="50%" stop-color="#38383e"/>
      <stop offset="100%" stop-color="#1e1e21"/>
    </linearGradient>

    <radialGradient id="coreBacking" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#36363a"/>
      <stop offset="60%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#141416"/>
    </radialGradient>

    <!-- Plume Gradients -->
    <linearGradient id="plumeBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4438"/>
      <stop offset="60%" stop-color="#eb1f14"/>
      <stop offset="100%" stop-color="#b8140c"/>
    </linearGradient>

    <linearGradient id="plumeMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb2014"/>
      <stop offset="60%" stop-color="#c4140b"/>
      <stop offset="100%" stop-color="#8a0c06"/>
    </linearGradient>

    <linearGradient id="plumeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3110a"/>
      <stop offset="100%" stop-color="#610703"/>
    </linearGradient>

    <!-- Helmet Armor Gradients -->
    <linearGradient id="helmSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2c2cb"/>
      <stop offset="40%" stop-color="#91919c"/>
      <stop offset="80%" stop-color="#63636d"/>
      <stop offset="100%" stop-color="#42424a"/>
    </linearGradient>

    <linearGradient id="helmHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9e9ea8"/>
    </linearGradient>

    <!-- Eye Glow Filter -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Curved Paths -->
    <path id="topTextPath" d="M 68 256 A 188 188 0 0 1 444 256" fill="none"/>
    <path id="bottomTextPath" d="M 444 256 A 188 188 0 0 1 68 256" fill="none"/>
  </defs>

  <!-- Base iOS Icon Squircle -->
  <rect x="6" y="6" width="500" height="500" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#squircleBorder)" stroke-width="4"/>
  <rect x="6" y="6" width="500" height="500" rx="112" ry="112" fill="url(#topFlare)"/>

  <!-- Centered RoboRaiders Emblem Group -->
  <g filter="url(#badgeShadow)">
    
    <!-- Outer Metal Beveled Ring -->
    <circle cx="256" cy="256" r="206" fill="url(#metalOuter)" stroke="#18181b" stroke-width="2"/>
    <circle cx="256" cy="256" r="202" fill="none" stroke="#9494a0" stroke-width="1.5" opacity="0.6"/>
    <circle cx="256" cy="256" r="168" fill="url(#metalInner)" stroke="#18181b" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="165" fill="none" stroke="#505058" stroke-width="1" opacity="0.8"/>

    <!-- Curved Text: ROBORAIDERS 6567 (Top Arc) -->
    <text fill="#141416" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="3.5" dy="12">
      <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
        ROBORAIDERS 6567
      </textPath>
    </text>
    <text fill="#d8d8e2" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="3.5" dy="10">
      <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
        ROBORAIDERS 6567
      </textPath>
    </text>

    <!-- Curved Text: FIRST TECH CHALLENGE (Bottom Arc) -->
    <text fill="#141416" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="21.5" letter-spacing="3" dy="19">
      <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
        FIRST TECH CHALLENGE
      </textPath>
    </text>
    <text fill="#9c9ca8" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="21.5" letter-spacing="3" dy="17">
      <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
        FIRST TECH CHALLENGE
      </textPath>
    </text>

    <!-- Left FIRST Tech Challenge Logo Marker -->
    <g transform="translate(80, 256) scale(0.72)">
      <path d="M-14,-10 L-2,-10 L-2,-6 L-10,-6 L-10,-2 L-4,-2 L-4,2 L-10,2 L-10,10 L-14,10 Z" fill="#b0b0bc"/>
      <rect x="0" y="-10" width="14" height="4" fill="#b0b0bc"/>
      <rect x="5" y="-6" width="4" height="16" fill="#b0b0bc"/>
      <text x="0" y="16" fill="#888894" font-family="sans-serif" font-weight="900" font-size="6" text-anchor="middle" letter-spacing="0.5">FTC</text>
    </g>

    <!-- Right Raiders Knot Symbol -->
    <g transform="translate(432, 256) scale(0.9)">
      <path d="M-10,-10 L0,-16 L10,-10 L10,2 L0,8 L-10,2 Z" fill="none" stroke="#b0b0bc" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-10,2 L0,8 L10,2 L10,14 L0,20 L-10,14 Z" fill="none" stroke="#b0b0bc" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="0" cy="2" r="2" fill="#ef4444"/>
    </g>

    <!-- Center Core Badge -->
    <circle cx="256" cy="256" r="144" fill="url(#coreBacking)" stroke="#424248" stroke-width="3"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#161618" stroke-width="2"/>

    <!-- Knight Graphic / Raider Silhouette with Rich Layered Plumes -->
    <g id="raider-knight-figure" transform="translate(256, 256) scale(1.85) translate(-100, -100)">
      
      <!-- Layer 1: Dark Under-Plumes (Crimson Red) -->
      <path 
        d="M 100,52 C 66,51 40,73 35,98 C 32,112 38,128 50,138 C 42,122 45,106 58,94 C 72,82 92,78 112,86 C 105,75 95,68 82,66 C 68,64 58,71 52,78 C 60,65 75,57 94,57 C 108,57 124,65 131,76 C 136,83 137,92 131,96 C 137,90 138,79 131,70 C 124,59 113,53 100,52 Z" 
        fill="url(#plumeDark)" 
      />
      
      <!-- Layer 2: Main Dynamic Plume Swirls (Vibrant Scarlet) -->
      <path 
        d="M 98,54 C 68,53 44,74 39,97 C 36,110 42,125 53,134 C 45,119 48,104 60,93 C 73,82 93,78 112,86 C 106,75 96,69 84,67 C 71,65 62,72 56,78 C 63,66 77,59 95,59 C 108,59 123,66 129,76 C 134,83 134,91 129,94 C 134,89 135,79 129,71 C 123,61 112,55 98,54 Z" 
        fill="url(#plumeBright)" 
      />
      
      <!-- Lower Plume Tail Wrapping Under Chin -->
      <path 
        d="M 46,108 C 40,124 45,141 58,150 C 50,139 48,124 56,113 C 64,102 76,98 89,100 C 78,93 67,93 59,98 C 50,103 46,100 46,108 Z" 
        fill="url(#plumeMid)" 
      />
      
      <!-- Upper Crown Plume Accents -->
      <path 
        d="M 72,68 C 85,58 104,56 120,64 C 112,62 98,64 88,71 C 78,78 72,88 70,98 C 68,86 70,76 72,68 Z" 
        fill="#ff6357" 
      />

      <!-- Rear Neck Crest Arc -->
      <path 
        d="M 115,83 C 109,94 98,105 98,119 C 98,134 109,147 125,151 C 136,153 144,145 147,136 C 136,144 122,143 114,133 C 106,122 106,109 114,98 Q 118,90 115,83 Z" 
        fill="url(#plumeDark)" 
      />
      <path 
        d="M 117,86 C 112,96 102,106 102,118 C 102,132 112,143 126,147 C 135,149 142,142 145,134 C 135,141 123,141 116,131 C 109,121 109,110 116,100 Q 119,93 117,86 Z" 
        fill="url(#plumeMid)" 
      />

      <!-- Knight Helmet: Base Shadow Underlay -->
      <path 
        d="M 114,80 C 124,76 139,80 145,91 C 150,98 149,111 143,121 C 136,130 121,137 108,129 C 102,123 102,112 106,101 C 111,90 109,83 114,80 Z" 
        fill="#141416" 
      />

      <!-- Knight Helmet: Armored Gorget / Neck Shield Plate -->
      <path 
        d="M 104,115 C 108,124 116,132 126,132 C 136,132 144,124 148,114 C 145,120 137,126 127,126 C 117,126 108,120 104,115 Z" 
        fill="#3f3f46" 
      />
      <path 
        d="M 108,120 C 112,128 120,135 128,135 C 138,135 144,128 147,121 C 144,126 137,130 128,130 C 119,130 112,125 108,120 Z" 
        fill="#52525b" 
      />

      <!-- Knight Helmet: Main Steel Body Dome -->
      <path 
        d="M 117,83 C 126,79 138,83 143,93 C 147,100 147,111 141,118 C 135,125 122,131 111,125 C 106,119 106,109 109,100 C 112,91 112,86 117,83 Z" 
        fill="url(#helmSteel)" 
        stroke="#27272a"
        stroke-width="1.2"
      />

      <!-- Helmet Highlight Crest Brow -->
      <path 
        d="M 119,85 C 124,82 133,84 137,91 C 139,95 139,101 137,105" 
        fill="none" 
        stroke="url(#helmHighlight)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
      />

      <!-- Helmet Brow Ridge Seam -->
      <path 
        d="M 117,89 C 124,87 134,89 139,95" 
        fill="none" 
        stroke="#27272a" 
        stroke-width="1.2" 
      />

      <!-- Visor Eye Recess Area (Deep Charcoal) -->
      <path 
        d="M 118,94 C 123,93 130,94 133,98 C 135,102 133,107 128,109 C 123,110 121,107 118,102 Z" 
        fill="#18181b" 
        stroke="#09090b"
        stroke-width="0.8"
      />

      <!-- Helmet Faceplate Ventilation Grille Slits -->
      <line x1="123" y1="103" x2="123" y2="114" stroke="#121214" stroke-width="1.5" stroke-linecap="round" />
      <line x1="127" y1="104" x2="127" y2="115" stroke="#121214" stroke-width="1.5" stroke-linecap="round" />
      <line x1="131" y1="105" x2="131" y2="114" stroke="#121214" stroke-width="1.5" stroke-linecap="round" />
      <line x1="135" y1="107" x2="135" y2="112" stroke="#121214" stroke-width="1.5" stroke-linecap="round" />

      <!-- Glowing Red Robotic Optic Sensor / Eye -->
      <g filter="url(#eyeGlow)">
        <path 
          d="M 120,96.5 Q 125,95.5 128,99.5" 
          fill="none" 
          stroke="#ff1a2b" 
          stroke-width="2.2" 
          stroke-linecap="round" 
        />
        <circle cx="126.5" cy="98.5" r="1.2" fill="#ffdede" />
        <circle cx="126.5" cy="98.5" r="2.2" fill="#ff3344" opacity="0.8" />
      </g>
    </g>
  </g>
</svg>
