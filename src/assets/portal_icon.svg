<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <clipPath id="leftClip">
      <polygon points="36,60 100,96 100,166 36,130"/>
    </clipPath>
    <clipPath id="rightClip">
      <polygon points="100,96 164,60 164,130 100,166"/>
    </clipPath>
  </defs>

  <!-- Isometric Box -->
  <g transform="translate(0, 5)">
    <!-- Top Face -->
    <polygon points="100,24 164,60 100,96 36,60" fill="url(#topFace)" stroke="#2563eb" stroke-width="1"/>

    <!-- Top Tape -->
    <polygon points="68,42 80,35 132,65 120,72" fill="#fbbf24"/>
    <polygon points="68,42 74,45 126,75 120,72" fill="#f59e0b"/>

    <!-- Left Face -->
    <polygon points="36,60 100,96 100,166 36,130" fill="url(#leftFace)"/>
    
    <!-- Left Face decorative curved element -->
    <g clip-path="url(#leftClip)">
      <path d="M36,60 Q80,120 100,96 L100,166 L36,166 Z" fill="#be123c" opacity="0.45"/>
      <!-- Tape wrap on left face -->
      <polygon points="56,71 63,75 63,88 56,84" fill="#fbbf24"/>
      <!-- Map Pin on Left Face -->
      <g transform="translate(86, 92) skewY(30) scale(0.65)">
        <path d="M0, -14 C-7,-14 -12,-9 -12,-2 C-12,5 0,16 0,16 C0,16 12,5 12,-2 C12,-9 7,-14 0,-14 Z" fill="#ffffff"/>
        <circle cx="0" cy="-3" r="4" fill="#e11d48"/>
      </g>
    </g>

    <!-- Right Face -->
    <polygon points="100,96 164,60 164,130 100,166" fill="url(#rightFace)"/>
    
    <!-- Right Face decorative arch and dot matrix -->
    <g clip-path="url(#rightClip)">
      <!-- Dark bottom arch -->
      <ellipse cx="140" cy="160" rx="45" ry="40" fill="#0f172a" opacity="0.6"/>
      <!-- Dot matrix pattern -->
      <g fill="#fbbf24" opacity="0.9">
        <circle cx="120" cy="110" r="1.6"/>
        <circle cx="126" cy="107" r="1.6"/>
        <circle cx="132" cy="104" r="1.6"/>
        <circle cx="138" cy="101" r="1.6"/>
        <circle cx="144" cy="98" r="1.6"/>
        <circle cx="150" cy="95" r="1.6"/>

        <circle cx="120" cy="116" r="1.6"/>
        <circle cx="126" cy="113" r="1.6"/>
        <circle cx="132" cy="110" r="1.6"/>
        <circle cx="138" cy="107" r="1.6"/>
        <circle cx="144" cy="104" r="1.6"/>
        <circle cx="150" cy="101" r="1.6"/>

        <circle cx="120" cy="122" r="1.6"/>
        <circle cx="126" cy="119" r="1.6"/>
        <circle cx="132" cy="116" r="1.6"/>
        <circle cx="138" cy="113" r="1.6"/>
        <circle cx="144" cy="110" r="1.6"/>
        <circle cx="150" cy="107" r="1.6"/>
      </g>
    </g>
  </g>
</svg>
